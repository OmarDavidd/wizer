# Garage (S3-compatible object storage), single node for development.
# Secrets are not here: docker-compose.dev.yml passes GARAGE_RPC_SECRET and, with
# `--single-node --default-bucket`, the access key and the private bucket (GARAGE_DEFAULT_*).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

# Admin API: only GET /health is used (unauthenticated), by /health/ready.
[admin]
api_bind_addr = "[::]:3903"
