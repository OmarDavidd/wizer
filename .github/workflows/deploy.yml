name: deploy

# Production only ever runs main: ci calls this after all its jobs pass on a push to main.
# (A workflow_run trigger would run on the default branch, develop, which the production
# environment rejects.) The server pulls origin/main itself; the runner only triggers it.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://wizer.omard.space
    steps:
      - uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server restricts this key to infra/deploy/deploy.sh, so no command is sent.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "wizer@${DEPLOY_HOST}"
