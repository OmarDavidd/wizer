name: dependabot-lockfiles

# Dependabot only updates the lock file of the project it bumps, but the test projects lock
# Wizer.Api's dependencies too, so `restore --locked-mode` fails until they are regenerated.
on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/backend/**/*.csproj"
      - "apps/backend/**/packages.lock.json"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore apps/backend/Wizer.slnx --force-evaluate
      - name: Commit regenerated lock files and re-run ci
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- '*packages.lock.json'; then
            echo "Lock files already in sync."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(deps): sync NuGet lock files'
          git push
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so ci is dispatched explicitly.
          gh workflow run ci.yml --ref "$BRANCH"
